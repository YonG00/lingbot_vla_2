# ============================================================================
# Stage A demo #3 —— 50 任务池 / 只允许新增 8 个技能（文档 §46）
#
# 要回答的问题不是「能不能训成功」，而是：
#   * 模型是否能自己找到最划算的学习路径？
#   * 它优先选了哪些任务？有没有优先选容易 transfer 的？
#   * 训练一个任务后，其他未训练任务是否自然变好（rescan 自动 PASS）？
#   * replay 是否足以维持前面学到的能力？
#   * scheduler 会不会陷入某类任务循环？
#
# 任务构成：12 个 base 就会 / 24 个练得动（需要 1~4 个 unit）/ 14 个 plateau（练不动）
# ⚠️ 假世界：NMSE 由曲线/解析式给出。
#
# 本文件由 `python -m auto_learning.tools.make_demo_50task` 生成。
# ============================================================================

description: "Stage A · 50 任务池，最多新增 8 个技能（文档 §46）"

auto_learning:
  enabled: true
  task_names: null
  max_new_tasks_attempted_this_run: 8
  max_new_tasks_passed_this_run: null

  global_scout_val_trajs: 2
  active_train_probe_trajs: 4
  active_val_probe_trajs: 4
  pass_nmse: 0.30

  eval_interval_steps: 50
  min_steps_before_defer: 100

  continue_after_pass: false
  post_pass_max_steps: 0
  post_pass_min_lp: 0.03

  min_lp50: 0.05
  max_attempts_per_task: 2

  defer_resample_retry: false
  defer_retry_steps: 50

  early_defer_on_overfit: true
  overfit_train_lp_min: 0.05
  overfit_val_lp_max: 0.00
  overfit_gap_growth_threshold: 0.10

  batch_size: 10
  new_slots: 7
  replay_slots: 3

  hardness_probe_fraction: 0.33
  hardness_weight_min: 1.0
  hardness_weight_max: 3.0
  hardness_alpha: 2.0
  difficulty_unscored_default: 0.5
  refresh_hardness_on_continue: false

  replay_task_policy: uniform
  replay_sample_policy: pass_snapshot

  review_after_task_transitions: 2
  forget_relative_threshold: 0.30

  rescan_candidates_after_transition: true
  max_global_steps: 6000
  max_transitions: null

  seed: 23

sim:
  seed: 23
  steps_per_unit: 50
  eval_noise_scale: 1.0
  replay_forget_protection: 0.60
  hardness_latent_skew: 2.0
  loss_floor: 0.02

