version: robotwin_curriculum_v1

dataset:
  name: RoboTwin_lerobot_v30
  # manifest (datasets.txt) 的第一列。决定 configs/robot_configs/<data_name>.yaml,
  # 所以必须是 robotwin —— 而不是数据集本身的名字。
  data_name: robotwin
  root: /data/datasets/robotwin_v3/lerobot_dataset/RoboTwin_lerobot_v30
  total_episodes: 2500
  total_tasks: 50
  episodes_per_task: 50
  fps: 15

qa:
  structural_status: pass
  hard_corrupted_episodes: 0
  confirmed_failed_episodes: 0
  excluded_episodes: []
  policy: keep_all
  notes:
    - Statistical anomaly does not imply bad demonstration.
    - Manual review found sampled high-score anomalies to be valid successful demonstrations.
    - open_microwave contains long idle/slow-contact segments but still completes the task.
    - No temporal trimming is applied in curriculum v1.

# 仅用于「长度分布统计」。规范第 8 节: 暂不采用短轨迹->长轨迹的二级 Curriculum,
# 因此 short/long 不参与分阶段 (分阶段只看 skill_levels, 见文件末尾 phases)。
trajectory_split:
  used_for_curriculum: false
  type: per_task_rank
  sort_keys:
    - length
    - episode_index
  short:
    rank_start: 1
    rank_end: 25
  long:
    rank_start: 26
    rank_end: 50
  notes:
    - Short and Long are relative within each canonical task.
    - Short does not mean easy and Long does not mean hard.
    - Raw trajectory length is used in v1.
    - open_microwave is retained under the same rule for reproducibility.

skill_levels:

  L1:
    name: basic_atomic_skills
    description: Single core primitive with limited sequential dependency.
    task_count: 14
    tasks:
      - click_bell
      - click_alarmclock
      - press_stapler
      - turn_switch
      - grab_roller
      - lift_pot
      - move_playingcard_away
      - place_phone_stand
      - place_object_stand
      - place_mouse_pad
      - move_pillbottle_pad
      - move_stapler_pad
      - move_can_pot
      - place_shoe

  L2:
    name: constrained_basic_skills
    description: Base primitive plus orientation, spatial relation, tool use, dynamic motion, or simple coordination.
    task_count: 15
    tasks:
      - adjust_bottle
      - place_a2b_left
      - place_a2b_right
      - rotate_qrcode
      - place_fan
      - place_container_plate
      - place_bread_skillet
      - place_empty_cup
      - place_object_scale
      - beat_block_hammer
      - stamp_seal
      - pick_dual_bottles
      - pick_diverse_bottles
      - shake_bottle
      - shake_bottle_horizontally

  L3:
    name: composed_skills
    description: Multiple primitives, articulated manipulation, multi-object interaction, or two-step coordination.
    task_count: 11
    tasks:
      - dump_bin_bigbin
      - open_laptop
      - open_microwave
      - handover_mic
      - place_bread_basket
      - place_burger_fries
      - place_object_basket
      - place_can_basket
      - place_cans_plasticbox
      - stack_blocks_two
      - stack_bowls_two

  L4:
    name: complex_composed_skills
    description: Strong multi-stage dependency, regrasp, handover-followed-by-action, ordering, or three-object manipulation.
    task_count: 10
    tasks:
      - scan_object
      - place_dual_shoes
      - handover_block
      - put_object_cabinet
      - hanging_mug
      - blocks_ranking_rgb
      - blocks_ranking_size
      - stack_bowls_three
      - stack_blocks_three
      - put_bottles_dustbin

# ============================================================================
# 4 阶段课程 (规范第 7 节)
#   必须累积: L1 -> L1+L2 -> L1+L2+L3 -> All, 避免灾难性遗忘。
#
# 历史说明: 旧版把每个等级再按轨迹长度拆 short/long, 共 8 阶 (C1..C8)。
# 规范第 8 节明确「暂不采用短轨迹->长轨迹的二级 Curriculum」, 故收敛为 4 阶。
# 短/长仅作为统计维度保留 (见上方 trajectory_split), 不参与分阶段。
#
# dir_name 同时决定生成的白名单文件名:
#   /data/train/phases/<dir_name>.episode_ids.json
# eval_name 决定该阶段的 sentinel 评测清单文件名:
#   /data/train/phases/<eval_name>   (传给 launcher 的 --task_list_file)
# ============================================================================
phases:

  P1:
    name: L1_only
    dir_name: phase1_L1
    eval_name: phase1_eval.txt
    levels: [L1]

  P2:
    name: L1_L2
    dir_name: phase2_L1_L2
    eval_name: phase2_eval.txt
    levels: [L1, L2]

  P3:
    name: L1_L2_L3
    dir_name: phase3_L1_L2_L3
    eval_name: phase3_eval.txt
    levels: [L1, L2, L3]

  P4:
    name: all
    dir_name: phase4_all
    eval_name: phase4_eval.txt
    levels: [L1, L2, L3, L4]

training:
  cumulative: true
  replay_weighting: none
  custom_sampling_weights: false
  final_stage_contains_all_data: true

# ============================================================================
# 固定 Sentinel 闭环评测 (规范第 9 / 10 / 15 节)
#
#   每 Level 固定 4 个 sentinel task, 一旦确定不再随机替换。
#   阶段累积: P1=4 -> P2=8 -> P3=12 -> P4=16 (P1 ⊂ P2 ⊂ P3 ⊂ P4)。
#   Clean 与 Randomized 使用完全相同的 sentinel task。
#
#   本段是 sentinel 的唯一真源: 代码里不含任何硬编码任务名。
#   tools/prepare_phase.py 读取本段生成:
#       /data/train/phases/phase1_eval.txt ... phase4_eval.txt
#   评测时交给官方 launcher:
#       bash experiment/robotwin/start_robotwin_infer_and_eval.sh \
#           --task_list_file /data/train/phases/phase1_eval.txt \
#           --task_config demo_clean ...
#
#   改 sentinel = 只改本段, 然后重跑 `python tools/prepare_phase.py --phase all`。
# ============================================================================
evaluation:
  status: frozen
  sentinel_per_level: 4
  sentinel:
    L1:
      - lift_pot           # 抓取提举
      - click_alarmclock   # 精细点击
      - turn_switch        # 关节开关
      - place_shoe         # 放置定位
    L2:
      - adjust_bottle          # 精细调整
      - place_container_plate  # 空间放置
      - rotate_qrcode          # 朝向旋转
      - shake_bottle           # 动态动作
    L3:
      - open_laptop          # 关节多步
      - stack_blocks_two     # 双臂堆叠
      - place_bread_basket   # 容器放置
      - dump_bin_bigbin      # 倾倒动态
    L4:
      - stack_bowls_three    # 三物体堆叠
      - hanging_mug          # 悬挂
      - put_bottles_dustbin  # 多物体序列
      - blocks_ranking_size  # 排序
  protocols:
    # 高频/低成本 mini eval (规范第 10 节) —— 用于判断趋势, 不用于精确估计。
    mini_eval:
      clean_episodes: 3
      randomized_episodes: 3
      seeds: [0]
    # 阶段结束的较可靠评测 —— 需要决定是否解冻 / Full FT / Phase5 加权时使用。
    stage_end_eval:
      seeds: [0, 1, 2]
      episodes_per_seed_per_condition: 3
  principles:
    - Use fixed tasks and fixed seeds for checkpoint-to-checkpoint comparison.
    - Evaluate current-level skills and previously learned skills.
    - Short/Long is a training-data property, not an evaluation environment category.
    - Final benchmark should evaluate the canonical RoboTwin tasks normally.
    - Clean and randomized evaluation should be reported separately.
  notes:
    - sentinel 于 2026-10-02 由用户确认冻结 (每 Level 4 个, 共 16 个)。
    - 覆盖点: 抓取 / 放置 / 精细定位 / 单臂双臂 / 开关关节 / 长短动作链 / 不同物体类型。
    - 每个 sentinel 必须属于它所在 Level, 由 tools/prepare_phase.py 强制校验。
