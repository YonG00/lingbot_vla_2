# Stage B1 smoke：Auto Learning 打开、cadence 缩短（**仅供 smoke，不是正式默认值**）
enabled: true
task_names: [click_bell]
batch_size: 10
new_slots: 7
replay_slots: 3
eval_interval_steps: 3
min_steps_before_defer: 6
defer_retry_steps: 6
max_attempts_per_task: 1
pass_nmse: 0.30
seed: 7

# ----- hardness（显式固定，避免吃类默认漂移）-----
# 类默认在 2026-10-08 由 0.33 改为 0.10（用户批准，用于正式与 GBS=4 smoke）；
# 本配置是历史对照用的单/双任务 smoke，显式保留 0.33 以与其历史结果可比。
hardness_probe_fraction: 0.33
